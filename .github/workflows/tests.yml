name: Run Tests

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Run tests with Maven
        run: mvn clean test
